<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SUNDER — v1</title>
<style>
  :root {
    --bg:#0C0C0E; --surface:#16161A; --gridline:#1C1C21;
    --text-2:#8E8E93; --text-1:#F5F5F7;
    --accent:#D4A359; --accent-soft:rgba(212,163,89,0.25);
    --sans:'Inter','SF Pro Display',-apple-system,'Segoe UI',sans-serif;
    --mono:'JetBrains Mono','SF Mono',Consolas,monospace;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { background:#000; min-height:100%; display:grid; place-items:start center; }
  #plugin-ui {
    width:960px; height:580px; background:var(--bg); color:var(--text-1);
    font-family:var(--sans); position:relative; overflow:hidden;
    display:grid; grid-template-rows:48px 344px 188px;
    user-select:none; -webkit-user-select:none;
  }
  /* ---------- HEADER ---------- */
  header {
    display:flex; align-items:center; justify-content:space-between;
    padding:0 24px; border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .wordmark { font-size:16px; font-weight:600; letter-spacing:.2em; color:var(--text-1); }
  .util { display:flex; align-items:center; gap:22px; }
  .util button {
    background:none; border:none; color:var(--text-2); cursor:pointer;
    font-family:var(--sans); font-size:10px; font-weight:500;
    letter-spacing:.1em; text-transform:uppercase; transition:color .15s;
  }
  .util button:hover { color:var(--text-1); }
  .util button.on { color:var(--accent); }
  .delta { font-size:13px !important; letter-spacing:0 !important; }
  /* ---------- CANVAS ---------- */
  .canvas { position:relative; padding:18px 24px 22px; }
  #spectral { width:100%; height:100%; display:block; }
  /* ---------- DOCK ---------- */
  .dock { display:flex; flex-direction:column; padding:0 24px 18px; }
  .profile {
    display:flex; justify-content:center; gap:0; height:34px; align-items:center;
    border-bottom:1px solid rgba(255,255,255,0.05); margin-bottom:14px;
  }
  .profile button {
    background:none; border:none; cursor:pointer; color:var(--text-2);
    font-family:var(--sans); font-size:10px; font-weight:500;
    letter-spacing:.14em; text-transform:uppercase; padding:6px 20px;
    transition:color .15s; position:relative;
  }
  .profile button:hover { color:var(--text-1); }
  .profile button.on { color:var(--accent); }
  .profile button.on::after {
    content:''; position:absolute; left:20px; right:20px; bottom:-15px;
    height:1px; background:var(--accent);
  }
  .encoders { flex:1; display:flex; justify-content:space-between; align-items:center; }
  .enc { width:104px; display:flex; flex-direction:column; align-items:center; gap:12px; cursor:ns-resize; }
  .ring { position:relative; width:72px; height:72px; }
  .ring svg { width:72px; height:72px; overflow:visible; display:block; }
  .ring .val { position:absolute; inset:0; display:grid; place-items:center;
    font-family:var(--mono); font-size:13px; font-weight:500; color:var(--text-1); pointer-events:none; }
  .enc .lbl { font-size:10px; font-weight:500; letter-spacing:.1em; text-transform:uppercase; color:var(--text-2); }
  .enc:hover .lbl { color:var(--text-1); }
</style>
</head>
<body>
<div id="plugin-ui">
  <header>
    <div class="wordmark">SUNDER</div>
    <nav class="util">
      <button id="preset">Init &#9662;</button>
      <button id="delta" class="delta" title="Delta Listen">&Delta;</button>
      <button id="ab">A/B</button>
      <button id="os">1&times;</button>
      <button id="bypass">Bypass</button>
    </nav>
  </header>

  <section class="canvas">
    <svg id="spectral" preserveAspectRatio="none"></svg>
  </section>

  <section class="dock">
    <div class="profile" id="profile"></div>
    <div class="encoders" id="encoders"></div>
  </section>
</div>

<script>
(() => {
  const A = getComputedStyle(document.documentElement);
  const ACCENT = A.getPropertyValue('--accent').trim();
  const TRACK  = A.getPropertyValue('--surface').trim();
  const GRID   = A.getPropertyValue('--gridline').trim();
  const T2     = A.getPropertyValue('--text-2').trim();
  const SVGNS  = 'http://www.w3.org/2000/svg';
  const clear = el => { while (el.firstChild) el.removeChild(el.firstChild); };

  // ---------- PROFILE SELECTOR ----------
  const MODES = ['5150','RECTO','HM-2','DJENT','BLACKENED','SLUDGE'];
  const profEl = document.getElementById('profile');
  MODES.forEach((m,i) => {
    const b = document.createElement('button');
    b.textContent = m; if (i===0) b.classList.add('on');
    b.onclick = () => { profEl.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); };
    profEl.appendChild(b);
  });

  // ---------- HEADER TOGGLES ----------
  const toggle = id => { const el=document.getElementById(id); el.onclick=()=>el.classList.toggle('on'); };
  ['delta','bypass','ab'].forEach(toggle);
  const os=document.getElementById('os'); const OSV=['1×','2×','4×']; let oi=0;
  os.onclick=()=>{ oi=(oi+1)%3; os.textContent=OSV[oi]; os.classList.toggle('on',oi>0); };

  // ---------- VECTOR ENCODERS ----------
  const ENC = [
    {label:'SUPPRESSION', value:50},
    {label:'TRANSIENT',   value:50},
    {label:'RESONANCE',   value:50},
    {label:'GRAIN',       value:50},
    {label:'AIR',         value:50},
    {label:'MIX',         value:100},
  ];
  const A_MIN=-135, A_SWEEP=270;            // 270 deg sweep, 90 deg gap at bottom
  const polar=(cx,cy,r,deg)=>{ const a=deg*Math.PI/180; return [cx+r*Math.sin(a), cy-r*Math.cos(a)]; };
  const arc=(cx,cy,r,a0,a1)=>{ const [x0,y0]=polar(cx,cy,r,a0),[x1,y1]=polar(cx,cy,r,a1);
    const large=(a1-a0)>180?1:0; return `M${x0} ${y0} A${r} ${r} 0 ${large} 1 ${x1} ${y1}`; };

  const encWrap=document.getElementById('encoders');
  ENC.forEach(e=>{
    const wrap=document.createElement('div'); wrap.className='enc';
    const R=30, C=36;
    const svg=document.createElementNS(SVGNS,'svg'); svg.setAttribute('viewBox','0 0 72 72');
    const track=document.createElementNS(SVGNS,'path');
    track.setAttribute('d',arc(C,C,R,A_MIN,A_MIN+A_SWEEP));
    track.setAttribute('stroke',TRACK); track.setAttribute('stroke-width','1.5');
    track.setAttribute('fill','none'); track.setAttribute('stroke-linecap','round');
    const value=document.createElementNS(SVGNS,'path');
    value.setAttribute('stroke',ACCENT); value.setAttribute('stroke-width','1.5');
    value.setAttribute('fill','none'); value.setAttribute('stroke-linecap','round');
    svg.appendChild(track); svg.appendChild(value);
    const ring=document.createElement('div'); ring.className='ring';
    const val=document.createElement('div'); val.className='val';
    ring.appendChild(svg); ring.appendChild(val);
    const lbl=document.createElement('div'); lbl.className='lbl'; lbl.textContent=e.label;
    wrap.appendChild(ring); wrap.appendChild(lbl); encWrap.appendChild(wrap);

    const render=()=>{ const a1=A_MIN+(e.value/100)*A_SWEEP;
      value.setAttribute('d',arc(C,C,R,A_MIN,a1)); val.textContent=Math.round(e.value)+'%'; };
    render();

    // vertical drag, like a real plugin knob
    let dragging=false, ly=0;
    wrap.addEventListener('pointerdown',ev=>{dragging=true;ly=ev.clientY;wrap.setPointerCapture(ev.pointerId);value.style.filter='drop-shadow(0 0 4px '+ACCENT+')';});
    wrap.addEventListener('pointermove',ev=>{ if(!dragging)return; e.value=Math.max(0,Math.min(100,e.value+(ly-ev.clientY)*0.6)); ly=ev.clientY; render(); });
    const end=()=>{dragging=false;value.style.filter='';};
    wrap.addEventListener('pointerup',end); wrap.addEventListener('pointercancel',end);
  });

  // ---------- SPECTRAL CANVAS ----------
  const svg=document.getElementById('spectral');
  const W=()=>svg.clientWidth, H=()=>svg.clientHeight;
  const FMIN=200, FMAX=12000;
  const fx=(f,w)=>(Math.log(f)-Math.log(FMIN))/(Math.log(FMAX)-Math.log(FMIN))*w;

  function mkLine(x1,y1,x2,y2){const l=document.createElementNS(SVGNS,'line');
    l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);
    l.setAttribute('stroke',GRID);l.setAttribute('stroke-width','0.5');return l;}
  function mkText(x,y,t,anchor){const e=document.createElementNS(SVGNS,'text');
    e.setAttribute('x',x);e.setAttribute('y',y);e.setAttribute('fill',T2);
    e.setAttribute('font-size','8');e.setAttribute('font-family',A.getPropertyValue('--sans'));
    e.setAttribute('text-anchor',anchor||'start');e.textContent=t;return e;}

  // smooth path through points (Catmull-Rom -> cubic bezier)
  function smooth(pts){ if(pts.length<2)return''; let d=`M${pts[0][0]} ${pts[0][1]}`;
    for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
      const c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
      const c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
      d+=` C${c1x} ${c1y} ${c2x} ${c2y} ${p2[0]} ${p2[1]}`;} return d; }

  let spec, veil, t=0;
  function build(){
    clear(svg);
    const w=W(),h=H();
    const defs=document.createElementNS(SVGNS,'defs');
    const veilGrad=document.createElementNS(SVGNS,'linearGradient');
    veilGrad.setAttribute('id','veil');veilGrad.setAttribute('x1','0');veilGrad.setAttribute('y1','0');
    veilGrad.setAttribute('x2','0');veilGrad.setAttribute('y2','1');
    const s1=document.createElementNS(SVGNS,'stop');s1.setAttribute('offset','0%');s1.setAttribute('stop-color',ACCENT);s1.setAttribute('stop-opacity','0.25');
    const s2=document.createElementNS(SVGNS,'stop');s2.setAttribute('offset','100%');s2.setAttribute('stop-color',ACCENT);s2.setAttribute('stop-opacity','0');
    veilGrad.appendChild(s1);veilGrad.appendChild(s2); defs.appendChild(veilGrad); svg.appendChild(defs);
    // grid: dB lines
    [0,-12,-24,-36].forEach((db,i)=>{ const y=8+(i/3)*(h-26);
      svg.appendChild(mkLine(0,y,w,y)); svg.appendChild(mkText(2,y-3,db+' dB','start')); });
    // grid: freq lines
    [200,1000,2000,5000,10000].forEach(f=>{ const x=fx(f,w);
      svg.appendChild(mkLine(x,8,x,h-16));
      svg.appendChild(mkText(x,h-4,f>=1000?(f/1000)+'k':f+'',f===200?'start':'middle')); });
    veil=document.createElementNS(SVGNS,'path'); veil.setAttribute('fill','url(#veil)'); svg.appendChild(veil);
    spec=document.createElementNS(SVGNS,'path'); spec.setAttribute('fill','none');
    spec.setAttribute('stroke',T2); spec.setAttribute('stroke-opacity','0.45');
    spec.setAttribute('stroke-width','1.5'); spec.setAttribute('stroke-linejoin','round'); svg.appendChild(spec);
  }

  function frame(){
    const w=W(),h=H(); t+=0.02;
    const top=8, bot=h-16, span=bot-top;
    const N=72; const pts=[], veilPts=[];
    for(let i=0;i<=N;i++){
      const fr=i/N; const f=FMIN*Math.pow(FMAX/FMIN,fr); const x=fx(f,w);
      const ridge=Math.exp(-Math.pow((Math.log(f)-Math.log(4200))/0.42,2));
      const body=0.55-0.30*fr;
      let mag=body+0.40*ridge + 0.015*Math.sin(t*1.3+fr*9);
      mag=Math.max(0.04,Math.min(0.96,mag));
      pts.push([x, bot-mag*span]);
      const tgt=Math.exp(-Math.pow((Math.log(f)-Math.log(4500))/0.46,2));
      const drape=(0.018+0.44*tgt)*(1+0.05*Math.sin(t+fr*6));
      veilPts.push([x, top+drape*span]);
    }
    spec.setAttribute('d',smooth(pts));
    const vd=`M0 ${top} `+ smooth(veilPts) + ` L${w} ${top} Z`;
    veil.setAttribute('d',vd);
    requestAnimationFrame(frame);
  }
  const ro=new ResizeObserver(()=>build()); ro.observe(svg);
  build(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
