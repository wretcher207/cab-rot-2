<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SUNDER — v2</title>
<style>
  :root {
    --screen:#0B0C0E; --gridline:#1B1D22;
    --text-2:#8E8E93; --text-1:#F5F5F7;
    --accent:#D4A359; --copper-deep:#3E2715; --copper-bright:#E59846; --silver:#E2E8F0;
    --bevel-light:#3A3F48; --bevel-dark:#050608;
    --sans:'Inter','SF Pro Display',-apple-system,'Segoe UI',sans-serif;
    --mono:'JetBrains Mono','SF Mono',Consolas,monospace;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body {
    min-height:100%; display:grid; place-items:center; padding:52px;
    background:radial-gradient(ellipse at 50% 28%, #16181d 0%, #0a0b0d 55%, #060708 100%);
  }
  #plugin-ui {
    width:960px; height:580px; color:var(--text-1); font-family:var(--sans);
    position:relative; display:grid; grid-template-rows:52px 340px 188px;
    border-radius:16px; overflow:hidden;
    background:linear-gradient(180deg,#1B1D22 0%,#0E1012 100%);
    box-shadow:
      0 44px 90px -24px rgba(0,0,0,0.85),
      0 6px 18px -6px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.06),
      inset 1px 0 0 rgba(255,255,255,0.03),
      inset -1px 0 0 rgba(0,0,0,0.45),
      inset 0 -2px 0 rgba(0,0,0,0.55);
    user-select:none; -webkit-user-select:none;
  }
  /* brushed dark-titanium grain on the chassis (behind content) */
  #plugin-ui::before {
    content:''; position:absolute; inset:0; border-radius:16px; pointer-events:none; z-index:0;
    background:repeating-linear-gradient(0deg,
      rgba(255,255,255,0.015) 0, rgba(255,255,255,0.015) 1px,
      transparent 1px, transparent 3px);
    opacity:.55;
  }
  /* faint top sheen on the chassis metal */
  #plugin-ui::after {
    content:''; position:absolute; left:0; right:0; top:0; height:120px; pointer-events:none; z-index:0;
    background:linear-gradient(180deg, rgba(255,255,255,0.05), transparent);
    border-radius:16px 16px 0 0;
  }
  /* ---------- HEADER ---------- */
  header {
    position:relative; z-index:2;
    display:flex; align-items:center; justify-content:space-between; padding:0 26px;
  }
  header::after {
    content:''; position:absolute; left:18px; right:18px; bottom:0; height:1px;
    background:linear-gradient(90deg, transparent, rgba(58,63,72,0.55) 20%, rgba(58,63,72,0.55) 80%, transparent);
  }
  .wordmark { font-size:16px; font-weight:600; letter-spacing:.22em; color:#C7CCD3; text-shadow:0 1px 0 rgba(0,0,0,0.75); }
  .util { display:flex; align-items:center; gap:22px; }
  .util button {
    background:none; border:none; color:var(--text-2); cursor:pointer;
    font-family:var(--sans); font-size:10px; font-weight:500;
    letter-spacing:.1em; text-transform:uppercase; transition:color .15s; text-shadow:0 1px 0 rgba(0,0,0,0.6);
  }
  .util button:hover { color:var(--text-1); }
  .util button.on { color:var(--accent); }
  .delta { font-size:13px !important; letter-spacing:0 !important; }
  /* ---------- RECESSED GLASS SCREEN ---------- */
  .canvas {
    position:relative; z-index:1; margin:4px 16px 14px; border-radius:8px; background:var(--screen);
    box-shadow:
      inset 0 2px 7px rgba(0,0,0,0.9),
      inset 1px 1px 0 var(--bevel-light),
      inset -1px -1px 0 var(--bevel-dark);
    overflow:hidden;
  }
  #spectral { width:100%; height:100%; display:block; position:relative; z-index:1; }
  .canvas .glass {
    content:''; position:absolute; inset:0; pointer-events:none; z-index:2; border-radius:8px;
    background:linear-gradient(132deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.012) 30%, rgba(255,255,255,0) 50%);
  }
  /* ---------- DOCK (knobs/modes upgraded in pass 2) ---------- */
  .dock { position:relative; z-index:1; display:flex; flex-direction:column; padding:0 24px 18px; }
  .profile {
    display:flex; justify-content:center; height:34px; align-items:center; margin-bottom:14px; position:relative;
  }
  .profile::after {
    content:''; position:absolute; left:0; right:0; bottom:-1px; height:1px;
    background:linear-gradient(90deg, transparent, rgba(58,63,72,0.4), transparent);
  }
  .profile button {
    background:none; border:none; cursor:pointer; color:var(--text-2);
    font-family:var(--sans); font-size:10px; font-weight:500;
    letter-spacing:.14em; text-transform:uppercase; padding:6px 20px; transition:color .15s; position:relative;
  }
  .profile button:hover { color:var(--text-1); }
  .profile button.on { color:var(--accent); }
  .profile button.on::after {
    content:''; position:absolute; left:20px; right:20px; bottom:-15px; height:1px; background:var(--accent);
  }
  .encoders { flex:1; display:flex; justify-content:space-between; align-items:center; }
  .enc { width:104px; display:flex; flex-direction:column; align-items:center; gap:12px; cursor:ns-resize; }
  .ring { position:relative; width:72px; height:72px; }
  .ring svg { width:72px; height:72px; overflow:visible; display:block; }
  .ring .val { position:absolute; inset:0; display:grid; place-items:center;
    font-family:var(--mono); font-size:13px; font-weight:500; color:var(--text-1); pointer-events:none; }
  .enc .lbl { font-size:10px; font-weight:500; letter-spacing:.1em; text-transform:uppercase; color:var(--text-2); }
  .enc:hover .lbl { color:var(--text-1); }
</style>
</head>
<body>
<div id="plugin-ui">
  <header>
    <div class="wordmark">SUNDER</div>
    <nav class="util">
      <button id="preset">Init &#9662;</button>
      <button id="delta" class="delta" title="Delta Listen">&Delta;</button>
      <button id="ab">A/B</button>
      <button id="os">1&times;</button>
      <button id="bypass">Bypass</button>
    </nav>
  </header>

  <section class="canvas">
    <svg id="spectral" preserveAspectRatio="none"></svg>
    <div class="glass"></div>
  </section>

  <section class="dock">
    <div class="profile" id="profile"></div>
    <div class="encoders" id="encoders"></div>
  </section>
</div>

<script>
(() => {
  const A = getComputedStyle(document.documentElement);
  const cv = n => A.getPropertyValue(n).trim();
  const ACCENT=cv('--accent'), GRID=cv('--gridline'), T2=cv('--text-2');
  const COPPER_DEEP=cv('--copper-deep'), COPPER_BRIGHT=cv('--copper-bright'), SILVER=cv('--silver');
  const SVGNS='http://www.w3.org/2000/svg';
  const clear = el => { while (el.firstChild) el.removeChild(el.firstChild); };

  // ---------- PROFILE SELECTOR ----------
  const MODES=['5150','RECTO','HM-2','DJENT','BLACKENED','SLUDGE'];
  const profEl=document.getElementById('profile');
  MODES.forEach((m,i)=>{ const b=document.createElement('button'); b.textContent=m; if(i===0)b.classList.add('on');
    b.onclick=()=>{ profEl.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); };
    profEl.appendChild(b); });

  // ---------- HEADER TOGGLES ----------
  ['delta','bypass','ab'].forEach(id=>{const el=document.getElementById(id); el.onclick=()=>el.classList.toggle('on');});
  const os=document.getElementById('os'); const OSV=['1×','2×','4×']; let oi=0;
  os.onclick=()=>{ oi=(oi+1)%3; os.textContent=OSV[oi]; os.classList.toggle('on',oi>0); };

  // ---------- VECTOR ENCODERS (flat v1 carry-over; knurled metal in pass 2) ----------
  const ENC=[{label:'SUPPRESSION',value:50},{label:'TRANSIENT',value:50},{label:'RESONANCE',value:50},
             {label:'GRAIN',value:50},{label:'AIR',value:50},{label:'MIX',value:100}];
  const A_MIN=-135, A_SWEEP=270;
  const polar=(cx,cy,r,deg)=>{const a=deg*Math.PI/180; return [cx+r*Math.sin(a), cy-r*Math.cos(a)];};
  const arc=(cx,cy,r,a0,a1)=>{const[x0,y0]=polar(cx,cy,r,a0),[x1,y1]=polar(cx,cy,r,a1);
    const large=(a1-a0)>180?1:0; return `M${x0} ${y0} A${r} ${r} 0 ${large} 1 ${x1} ${y1}`;};
  const encWrap=document.getElementById('encoders');
  ENC.forEach(e=>{
    const wrap=document.createElement('div'); wrap.className='enc'; const R=30,C=36;
    const svg=document.createElementNS(SVGNS,'svg'); svg.setAttribute('viewBox','0 0 72 72');
    const track=document.createElementNS(SVGNS,'path'); track.setAttribute('d',arc(C,C,R,A_MIN,A_MIN+A_SWEEP));
    track.setAttribute('stroke','#16161A'); track.setAttribute('stroke-width','1.5'); track.setAttribute('fill','none'); track.setAttribute('stroke-linecap','round');
    const value=document.createElementNS(SVGNS,'path'); value.setAttribute('stroke',ACCENT); value.setAttribute('stroke-width','1.5'); value.setAttribute('fill','none'); value.setAttribute('stroke-linecap','round');
    svg.appendChild(track); svg.appendChild(value);
    const ring=document.createElement('div'); ring.className='ring'; const val=document.createElement('div'); val.className='val';
    ring.appendChild(svg); ring.appendChild(val);
    const lbl=document.createElement('div'); lbl.className='lbl'; lbl.textContent=e.label;
    wrap.appendChild(ring); wrap.appendChild(lbl); encWrap.appendChild(wrap);
    const render=()=>{const a1=A_MIN+(e.value/100)*A_SWEEP; value.setAttribute('d',arc(C,C,R,A_MIN,a1)); val.textContent=Math.round(e.value)+'%';};
    render();
    let dragging=false,ly=0;
    wrap.addEventListener('pointerdown',ev=>{dragging=true;ly=ev.clientY;wrap.setPointerCapture(ev.pointerId);value.style.filter='drop-shadow(0 0 4px '+ACCENT+')';});
    wrap.addEventListener('pointermove',ev=>{if(!dragging)return;e.value=Math.max(0,Math.min(100,e.value+(ly-ev.clientY)*0.6));ly=ev.clientY;render();});
    const end=()=>{dragging=false;value.style.filter='';}; wrap.addEventListener('pointerup',end); wrap.addEventListener('pointercancel',end);
  });

  // ---------- SPECTRAL GLASS + LIQUID SILK ----------
  const svg=document.getElementById('spectral');
  const W=()=>svg.clientWidth, H=()=>svg.clientHeight;
  const FMIN=200, FMAX=12000;
  const fx=(f,w)=>(Math.log(f)-Math.log(FMIN))/(Math.log(FMAX)-Math.log(FMIN))*w;
  function mkLine(x1,y1,x2,y2){const l=document.createElementNS(SVGNS,'line');
    l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);
    l.setAttribute('stroke',GRID);l.setAttribute('stroke-width','0.5');return l;}
  function mkText(x,y,t,anchor){const e=document.createElementNS(SVGNS,'text');
    e.setAttribute('x',x);e.setAttribute('y',y);e.setAttribute('fill',T2);e.setAttribute('font-size','8');
    e.setAttribute('font-family',cv('--sans'));e.setAttribute('text-anchor',anchor||'start');e.textContent=t;return e;}
  function smooth(pts){ if(pts.length<2)return''; let d=`M${pts[0][0]} ${pts[0][1]}`;
    for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
      const c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6,c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;
      d+=` C${c1x} ${c1y} ${c2x} ${c2y} ${p2[0]} ${p2[1]}`;} return d; }

  let spec, silkBase, silkThread, silkEdge, t=0;
  function build(){
    clear(svg); const w=W(),h=H();
    const defs=document.createElementNS(SVGNS,'defs');
    // base copper fill gradient (vertical)
    const g1=document.createElementNS(SVGNS,'linearGradient'); g1.id='silkFill';
    g1.setAttribute('x1','0');g1.setAttribute('y1','0');g1.setAttribute('x2','0');g1.setAttribute('y2','1');
    const a1=document.createElementNS(SVGNS,'stop');a1.setAttribute('offset','0%');a1.setAttribute('stop-color',COPPER_DEEP);a1.setAttribute('stop-opacity','0.9');
    const a2=document.createElementNS(SVGNS,'stop');a2.setAttribute('offset','100%');a2.setAttribute('stop-color','#0B0C0E');a2.setAttribute('stop-opacity','0');
    g1.appendChild(a1);g1.appendChild(a2); defs.appendChild(g1);
    // front edge gradient (horizontal: silver wings -> copper center -> silver)
    const g2=document.createElementNS(SVGNS,'linearGradient'); g2.id='silkEdge';
    g2.setAttribute('x1','0');g2.setAttribute('y1','0');g2.setAttribute('x2','1');g2.setAttribute('y2','0');
    [['0%',SILVER,'0.7'],['38%',ACCENT,'0.95'],['50%','#F0C079','1'],['62%',ACCENT,'0.95'],['100%',SILVER,'0.7']].forEach(([o,c,op])=>{
      const s=document.createElementNS(SVGNS,'stop');s.setAttribute('offset',o);s.setAttribute('stop-color',c);s.setAttribute('stop-opacity',op);g2.appendChild(s);});
    defs.appendChild(g2);
    // soft glow filter for the edge (under-glass bloom)
    const fl=document.createElementNS(SVGNS,'filter'); fl.id='glow'; fl.setAttribute('x','-20%');fl.setAttribute('y','-50%');fl.setAttribute('width','140%');fl.setAttribute('height','200%');
    const fb=document.createElementNS(SVGNS,'feGaussianBlur'); fb.setAttribute('stdDeviation','2.2'); fb.setAttribute('result','b');
    const fm=document.createElementNS(SVGNS,'feMerge'); const m1=document.createElementNS(SVGNS,'feMergeNode'); m1.setAttribute('in','b');
    const m2=document.createElementNS(SVGNS,'feMergeNode'); m2.setAttribute('in','SourceGraphic'); fm.appendChild(m1);fm.appendChild(m2);
    fl.appendChild(fb);fl.appendChild(fm); defs.appendChild(fl);
    svg.appendChild(defs);
    // gridlines (behind everything)
    [0,-12,-24,-36].forEach((db,i)=>{const y=8+(i/3)*(h-26); svg.appendChild(mkLine(0,y,w,y)); svg.appendChild(mkText(2,y-3,db+' dB','start'));});
    [200,1000,2000,5000,10000].forEach(f=>{const x=fx(f,w); svg.appendChild(mkLine(x,8,x,h-16)); svg.appendChild(mkText(x,h-4,f>=1000?(f/1000)+'k':f+'',f===200?'start':'middle'));});
    // silk layers: base fill, thread, edge
    silkBase=document.createElementNS(SVGNS,'path'); silkBase.setAttribute('fill','url(#silkFill)'); svg.appendChild(silkBase);
    silkThread=document.createElementNS(SVGNS,'path'); silkThread.setAttribute('fill','none'); silkThread.setAttribute('stroke',COPPER_BRIGHT); silkThread.setAttribute('stroke-opacity','0.15'); silkThread.setAttribute('stroke-width','1.5'); svg.appendChild(silkThread);
    silkEdge=document.createElementNS(SVGNS,'path'); silkEdge.setAttribute('fill','none'); silkEdge.setAttribute('stroke','url(#silkEdge)'); silkEdge.setAttribute('stroke-width','1.5'); silkEdge.setAttribute('filter','url(#glow)'); svg.appendChild(silkEdge);
    // input spectrum (front, bright silver)
    spec=document.createElementNS(SVGNS,'path'); spec.setAttribute('fill','none'); spec.setAttribute('stroke','#D8DEE6'); spec.setAttribute('stroke-opacity','0.6'); spec.setAttribute('stroke-width','1.5'); spec.setAttribute('stroke-linejoin','round'); svg.appendChild(spec);
  }
  function frame(){
    const w=W(),h=H(); t+=0.018; const top=8, bot=h-16, span=bot-top;
    const N=80, pts=[], veil=[];
    for(let i=0;i<=N;i++){ const fr=i/N; const f=FMIN*Math.pow(FMAX/FMIN,fr); const x=fx(f,w);
      const ridge=Math.exp(-Math.pow((Math.log(f)-Math.log(4200))/0.42,2));
      let mag=(0.55-0.30*fr)+0.40*ridge+0.015*Math.sin(t*1.3+fr*9); mag=Math.max(0.04,Math.min(0.96,mag));
      pts.push([x, bot-mag*span]);
      const tgt=Math.exp(-Math.pow((Math.log(f)-Math.log(4500))/0.46,2));
      const drape=(0.02+0.46*tgt)*(1+0.06*Math.sin(t+fr*6)); veil.push([x, top+drape*span]); }
    const veilPath=smooth(veil);
    silkBase.setAttribute('d',`M0 ${top} ${veilPath} L${w} ${top} Z`);
    const thread=veil.map(p=>[p[0]+5,p[1]-2]); silkThread.setAttribute('d',smooth(thread));
    silkEdge.setAttribute('d',veilPath);
    spec.setAttribute('d',smooth(pts));
    requestAnimationFrame(frame);
  }
  const ro=new ResizeObserver(()=>build()); ro.observe(svg); build(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
