<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CAB ROT 2 // ADVANCED PHASE ENGINE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --obsidian: #080809;
            --glass: rgba(15, 20, 18, 0.85);
            --toxic-plasma: #ceff00;
            --rim-light: rgba(255, 255, 255, 0.08);
            --anisotropic: conic-gradient(from 180deg at 50% 50%, #111 0deg, #333 90deg, #111 180deg, #333 270deg, #111 360deg);
        }

        body {
            background: #020202;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* The Chassis: Heavy Ceramic/Magnesium Alloy */
        .vst-container {
            width: 820px;
            height: 480px;
            background: var(--obsidian);
            border-radius: 4px;
            position: relative;
            padding: 2px; /* For the rim light */
            box-shadow:
                0 100px 150px -50px rgba(0,0,0,0.9),
                0 0 0 1px #000;
            background-image:
                linear-gradient(135deg, var(--rim-light) 0%, transparent 10%, transparent 90%, var(--rim-light) 100%);
        }

        /* The Main Faceplate */
        .faceplate {
            width: 100%;
            height: 100%;
            background: #0c0c0d;
            border-radius: 2px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Machined Metal Texture Overlay */
        .faceplate::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.05;
            pointer-events: none;
        }

        /* Top Bar: Precision Diagnostics */
        .precision-header {
            height: 40px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            display: flex;
            align-items: center;
            padding: 0 20px;
            justify-content: space-between;
        }

        .header-text {
            font-size: 9px;
            letter-spacing: 2px;
            color: #444;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* The LCD/Glass Panel */
        .glass-module {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow:
                inset 0 0 30px rgba(0,0,0,0.5),
                0 10px 20px rgba(0,0,0,0.3);
            border-radius: 2px;
            position: relative;
            overflow: hidden;
        }

        /* The 2039 "Flywheel" Knob */
        .flywheel-knob {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: var(--anisotropic);
            position: relative;
            box-shadow:
                0 20px 40px rgba(0,0,0,0.6),
                inset 0 1px 0 rgba(255,255,255,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: ns-resize;
            border: 4px solid #080809;
        }

        .flywheel-indicator {
            position: absolute;
            top: 15px;
            width: 2px;
            height: 12px;
            background: var(--toxic-plasma);
            box-shadow: 0 0 10px var(--toxic-plasma);
            border-radius: 1px;
        }

        .knob-inner-ring {
            width: 80%;
            height: 80%;
            border-radius: 50%;
            background: #0c0c0d;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Liquid OLED Metering */
        .liquid-meter {
            width: 4px;
            height: 100px;
            background: rgba(255,255,255,0.02);
            border-radius: 2px;
            position: relative;
        }

        .meter-glow {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: var(--toxic-plasma);
            box-shadow: 0 0 20px rgba(206, 255, 0, 0.6);
            border-radius: 2px;
            transition: height 0.1s ease-out;
        }

        /* Precision Labels */
        .vst-label {
            font-size: 10px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

    </style>
</head>
<body>

    <div class="vst-container">
        <div class="faceplate">
            <div class="precision-header">
                <span class="header-text">Module: Cab_Rot_2 // Serial: 0098-X</span>
                <div class="flex gap-4">
                    <span class="header-text text-[var(--toxic-plasma)]">Active State</span>
                    <span class="header-text">96kHz / 64bit</span>
                </div>
            </div>

            <div class="grid grid-cols-12 gap-8 p-10 h-full">

                <div class="col-span-3 flex flex-col justify-between">
                    <div>
                        <div class="vst-label">Input Stage</div>
                        <div class="glass-module p-4 h-24 mb-6">
                            <div class="flex justify-between items-end h-full">
                                <div class="liquid-meter"><div class="meter-glow" style="height: 70%"></div></div>
                                <div class="liquid-meter"><div class="meter-glow" style="height: 65%"></div></div>
                                <div class="liquid-meter"><div class="meter-glow" style="height: 85%"></div></div>
                                <div class="liquid-meter"><div class="meter-glow" style="height: 40%"></div></div>
                            </div>
                        </div>
                    </div>

                    <div>
                        <div class="vst-label">Air Density</div>
                        <div class="flex gap-2">
                            <button class="w-full py-2 bg-zinc-900 border border-zinc-800 text-[9px] font-bold text-zinc-500 hover:text-[var(--toxic-plasma)] hover:border-[var(--toxic-plasma)] transition-all">ATMOS_1</button>
                            <button class="w-full py-2 bg-zinc-900 border border-zinc-800 text-[9px] font-bold text-zinc-500">ATMOS_2</button>
                        </div>
                    </div>
                </div>

                <div class="col-span-6 flex flex-col items-center justify-center">
                    <div class="vst-label mb-8">Cabinet Phase Rotation</div>
                    <div class="flywheel-knob" id="knob">
                        <div class="flywheel-indicator"></div>
                        <div class="knob-inner-ring">
                            <span class="text-4xl font-light text-zinc-100 tracking-tighter" id="val">180<span class="text-xs text-zinc-600">°</span></span>
                        </div>
                    </div>
                    <div class="mt-8 text-[9px] text-zinc-700 tracking-[4px] uppercase">Engine Friction: 0.04ms</div>
                </div>

                <div class="col-span-3 flex flex-col justify-between items-end">
                    <div class="w-full">
                        <div class="vst-label text-right">Spectral Weight</div>
                        <div class="glass-module p-6 h-32 w-full flex items-center justify-center">
                            <svg viewBox="0 0 100 40" class="w-full h-full opacity-30">
                                <path d="M0 20 Q 25 5, 50 20 T 100 20" stroke="var(--toxic-plasma)" fill="none" stroke-width="0.5"/>
                                <path d="M0 25 Q 25 10, 50 25 T 100 25" stroke="var(--toxic-plasma)" fill="none" stroke-width="0.2"/>
                            </svg>
                        </div>
                    </div>

                    <button class="px-6 py-4 bg-transparent border border-zinc-800 text-[10px] tracking-[3px] text-zinc-400 hover:bg-white hover:text-black transition-all font-bold">
                        ACCESS THE CRYPT
                    </button>
                </div>

            </div>

            <div class="h-10 border-t border-zinc-900 mt-auto flex items-center px-6 justify-between opacity-30">
                <span class="header-text">Rotational Latency: 0ms</span>
                <span class="header-text">V2.0.1 - Engine Stable</span>
            </div>
        </div>
    </div>

    <script>
        const knob = document.getElementById('knob');
        const val = document.getElementById('val');
        let rotation = 0;

        knob.addEventListener('mousemove', (e) => {
            if (e.buttons === 1) {
                rotation += e.movementX;
                knob.style.transform = `rotate(${rotation}deg)`;
                // Make the text stay upright while knob spins
                val.parentElement.style.transform = `rotate(${-rotation}deg)`;
                val.innerHTML = `${Math.abs(rotation % 360)}<span class="text-xs text-zinc-600">°</span>`;
            }
        });
    </script>
</body>
</html>
